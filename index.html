<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking</title>
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/vision_bundle.mjs";

    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17]
    ];
    const FINGER_TIPS  = [4, 8, 12, 16, 20];
    const FINGER_BASES = [2, 6, 10, 14, 18];

    // ---- DOM ----
    const video       = document.getElementById("video");
    const camCanvas   = document.getElementById("cam-canvas");   // camera + skeleton
    const drawCanvas  = document.getElementById("draw-canvas");  // persistent drawing
    const camCtx      = camCanvas.getContext("2d");
    const drawCtx     = drawCanvas.getContext("2d");
    const gestureEl   = document.getElementById("gesture");
    const handCountEl = document.getElementById("hand-count");
    const fpsEl       = document.getElementById("fps");
    const statusEl    = document.getElementById("status");
    const toggleBtn   = document.getElementById("toggle-draw");
    const clearBtn    = document.getElementById("clear-draw");
    const modeEl      = document.getElementById("mode-indicator");

    // ---- State ----
    let landmarker   = null;
    let frameCount   = 0, fps = 0, fpsTimer = 0;
    let drawEnabled  = true;

    // Per-hand smoothed pinch position { x, y } (in canvas px)
    const smoothed = { Left: null, Right: null };
    // Was pinching last frame?
    const wasPinching = { Left: false, Right: false };

    // Smoothing factor (0 = no smoothing, 1 = frozen)
    const ALPHA = 0.5;
    // Dead-zone in px — movements smaller than this are ignored while drawing
    const DEAD_ZONE = 4;
    // Pinch threshold (normalised distance between thumb tip & index tip)
    const PINCH_THRESH = 0.07;
    // Eraser radius (px in canvas space)
    const ERASER_R = 40;
    // Pen size
    const PEN_SIZE = 5;

    // ---- Helpers ----
    function dist(a, b) {
      return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
    }

    function lerp(prev, next, alpha) {
      if (!prev) return next;
      return { x: prev.x + (next.x - prev.x) * alpha, y: prev.y + (next.y - prev.y) * alpha };
    }

    // ---- Init ----
    async function init() {
      statusEl.textContent = "กำลังโหลดโมเดล...";
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm"
      );
      landmarker = await HandLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      statusEl.textContent = "กำลังเปิดกล้อง...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          const W = video.videoWidth, H = video.videoHeight;
          camCanvas.width = drawCanvas.width = W;
          camCanvas.height = drawCanvas.height = H;
          // Mirror both canvases via CSS
          camCanvas.style.transform = drawCanvas.style.transform = "scaleX(-1)";
          statusEl.style.display = "none";
          requestAnimationFrame(detect);
        };
      } catch (e) {
        statusEl.textContent = "❌ ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้งานกล้อง";
      }
    }

    // ---- Gesture label ----
    function detectGesture(lm) {
      const tips  = FINGER_TIPS.map(i => lm[i]);
      const bases = FINGER_BASES.map(i => lm[i]);
      const thumbOpen = lm[4].x < lm[3].x;
      const extended  = [1,2,3,4].map(i => tips[i].y < bases[i].y);
      const extCount  = extended.filter(Boolean).length + (thumbOpen ? 1 : 0);
      if (!thumbOpen && extended.every(e => !e)) return "✊ Fist";
      if (thumbOpen && extended.every(e => e))   return "🖐 Open Hand";
      if (!thumbOpen && extended[0] && !extended[1] && !extended[2] && !extended[3]) return "☝️ Point";
      if (!thumbOpen && extended[0] && extended[1] && !extended[2] && !extended[3]) return "✌️ Peace";
      if (thumbOpen && !extended[0] && !extended[1] && !extended[2] && !extended[3]) return "👍 Thumbs Up";
      if (thumbOpen && !extended[0] && !extended[1] && !extended[2] && extended[3]) return "🤙 Call Me";
      if (extCount === 0) return "✊ Fist";
      return `🖐 ${extCount} Finger${extCount > 1 ? 's' : ''}`;
    }

    // ---- Draw skeleton ----
    function drawSkeleton(lm, handedness) {
      const w = camCanvas.width, h = camCanvas.height;
      const isLeft  = handedness === "Left";
      const primary = isLeft ? "#60efff" : "#bf80ff";
      const secondary = isLeft ? "#0057ff" : "#7b00ff";
      const tipColor = isLeft ? "#ffffff" : "#ffccff";

      camCtx.lineCap = "round";
      CONNECTIONS.forEach(([a, b]) => {
        const ax = lm[a].x * w, ay = lm[a].y * h;
        const bx = lm[b].x * w, by = lm[b].y * h;
        camCtx.beginPath();
        const grad = camCtx.createLinearGradient(ax, ay, bx, by);
        grad.addColorStop(0, primary + "cc");
        grad.addColorStop(1, secondary + "cc");
        camCtx.strokeStyle = grad;
        camCtx.lineWidth = 3;
        camCtx.shadowColor = primary;
        camCtx.shadowBlur = 10;
        camCtx.moveTo(ax, ay);
        camCtx.lineTo(bx, by);
        camCtx.stroke();
      });
      camCtx.shadowBlur = 0;

      lm.forEach((pt, i) => {
        const x = pt.x * w, y = pt.y * h;
        const isTip = FINGER_TIPS.includes(i);
        const r = isTip ? 8 : 5;
        camCtx.beginPath();
        camCtx.arc(x, y, r, 0, Math.PI * 2);
        camCtx.fillStyle = isTip ? tipColor : primary;
        camCtx.shadowColor = primary;
        camCtx.shadowBlur = isTip ? 20 : 12;
        camCtx.fill();
        camCtx.shadowBlur = 0;
        if (isTip) {
          camCtx.beginPath();
          camCtx.arc(x, y, r + 4, 0, Math.PI * 2);
          camCtx.strokeStyle = primary + "66";
          camCtx.lineWidth = 2;
          camCtx.stroke();
        }
      });
    }

    // ---- Draw cursor overlay (pen/eraser indicator) ----
    function drawCursor(x, y, isEraser, pinching) {
      const w = camCanvas.width;
      camCtx.save();
      if (isEraser) {
        camCtx.beginPath();
        camCtx.arc(x, y, ERASER_R, 0, Math.PI * 2);
        camCtx.strokeStyle = pinching ? "#ff6060" : "rgba(255,100,100,0.5)";
        camCtx.lineWidth = pinching ? 3 : 2;
        camCtx.setLineDash([6, 4]);
        camCtx.stroke();
        camCtx.setLineDash([]);
      } else {
        // Pen dot
        camCtx.beginPath();
        camCtx.arc(x, y, pinching ? PEN_SIZE : 6, 0, Math.PI * 2);
        camCtx.fillStyle = pinching ? "#fff" : "rgba(255,255,255,0.4)";
        camCtx.shadowColor = "#bf80ff";
        camCtx.shadowBlur = pinching ? 20 : 8;
        camCtx.fill();
        camCtx.shadowBlur = 0;
        // Crosshair
        if (!pinching) {
          camCtx.strokeStyle = "rgba(255,255,255,0.3)";
          camCtx.lineWidth = 1;
          camCtx.beginPath(); camCtx.moveTo(x - 12, y); camCtx.lineTo(x + 12, y); camCtx.stroke();
          camCtx.beginPath(); camCtx.moveTo(x, y - 12); camCtx.lineTo(x, y + 12); camCtx.stroke();
        }
      }
      camCtx.restore();
    }

    // ---- Main detect loop ----
    function detect(timestamp) {
      if (!landmarker || video.readyState < 2) { requestAnimationFrame(detect); return; }

      frameCount++;
      if (timestamp - fpsTimer > 1000) {
        fps = frameCount; frameCount = 0; fpsTimer = timestamp;
        fpsEl.textContent = `${fps} FPS`;
      }

      const result = landmarker.detectForVideo(video, timestamp);
      const W = camCanvas.width, H = camCanvas.height;

      // --- Camera frame ---
      camCtx.clearRect(0, 0, W, H);
      camCtx.drawImage(video, 0, 0, W, H);
      camCtx.fillStyle = "rgba(0,0,0,0.2)";
      camCtx.fillRect(0, 0, W, H);

      const hands = result.landmarks || [];
      handCountEl.textContent = `${hands.length} มือ`;

      // Track which hands are present this frame
      const presentHands = new Set();
      const gestures = [];

      hands.forEach((lm, i) => {
        const handedness = result.handedness?.[i]?.[0]?.categoryName || "Right";
        presentHands.add(handedness);
        drawSkeleton(lm, handedness);
        gestures.push(detectGesture(lm));

        if (!drawEnabled) return;

        const isLeft   = handedness === "Left";
        const thumbTip = lm[4];
        const indexTip = lm[8];

        // Normalised pinch distance
        const pinchDist = dist(thumbTip, indexTip);
        const pinching  = pinchDist < PINCH_THRESH;

        // Midpoint of thumb & index (in canvas px)
        const rawX = ((thumbTip.x + indexTip.x) / 2) * W;
        const rawY = ((thumbTip.y + indexTip.y) / 2) * H;
        const raw  = { x: rawX, y: rawY };

        // Smooth position
        smoothed[handedness] = lerp(smoothed[handedness], raw, ALPHA);
        const sx = smoothed[handedness].x;
        const sy = smoothed[handedness].y;

        // Draw cursor indicator
        drawCursor(sx, sy, isLeft, pinching);

        // ---- Drawing / Erasing logic ----
        if (pinching) {
          if (isLeft) {
            // Eraser
            drawCtx.save();
            drawCtx.globalCompositeOperation = "destination-out";
            drawCtx.beginPath();
            drawCtx.arc(sx, sy, ERASER_R, 0, Math.PI * 2);
            drawCtx.fill();
            drawCtx.restore();
          } else {
            // Pen — only draw if moved enough (dead-zone anti-jitter)
            if (wasPinching[handedness] && smoothed[handedness]) {
              const prev = smoothed[handedness];
              const moved = Math.sqrt((sx - prev.x) ** 2 + (sy - prev.y) ** 2);
              // We draw regardless of dead zone for continuity, but dead zone
              // is applied by the smoothing alpha already dampening small moves.
              // Extra guard: skip if we'd draw a zero-length segment
              drawCtx.beginPath();
              drawCtx.moveTo(wasPinching._lastX ?? sx, wasPinching._lastY ?? sy);
              drawCtx.lineTo(sx, sy);
              drawCtx.strokeStyle = "#ffffff";
              drawCtx.lineWidth = PEN_SIZE;
              drawCtx.lineCap = "round";
              drawCtx.lineJoin = "round";
              drawCtx.shadowColor = "#bf80ff";
              drawCtx.shadowBlur = 12;
              drawCtx.stroke();
              drawCtx.shadowBlur = 0;
            }
            wasPinching._lastX = sx;
            wasPinching._lastY = sy;
          }
          wasPinching[handedness] = true;
        } else {
          wasPinching[handedness] = false;
          if (!isLeft) { wasPinching._lastX = null; wasPinching._lastY = null; }
        }
      });

      // Reset smoothed state for hands no longer visible
      ["Left","Right"].forEach(h => { if (!presentHands.has(h)) { smoothed[h] = null; wasPinching[h] = false; } });

      // Gesture label
      if (gestures.length > 0) {
        gestureEl.textContent = gestures.join("  ");
        gestureEl.style.opacity = "1";
      } else {
        gestureEl.style.opacity = "0.3";
        gestureEl.textContent = "ยกมือขึ้น";
      }

      requestAnimationFrame(detect);
    }

    // ---- UI Controls ----
    toggleBtn.addEventListener("click", () => {
      drawEnabled = !drawEnabled;
      toggleBtn.textContent = drawEnabled ? "🎨 วาดรูป: เปิด" : "🎨 วาดรูป: ปิด";
      toggleBtn.classList.toggle("off", !drawEnabled);
      modeEl.style.display = drawEnabled ? "flex" : "none";
    });

    clearBtn.addEventListener("click", () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });

    init();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050508;
      color: #fff;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      overflow: hidden;
    }

    #top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    #title {
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      white-space: nowrap;
    }

    .ctrl-btn {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .ctrl-btn.off { border-color: rgba(255,80,80,0.4); color: rgba(255,100,100,0.7); }

    #canvas-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(96,239,255,0.06), 0 0 0 1px rgba(255,255,255,0.06);
      width: min(1280px, 98vw);
      aspect-ratio: 16/9;
      max-height: 82vh;
      flex-shrink: 0;
    }

    #canvas-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #draw-canvas { z-index: 2; pointer-events: none; }
    #cam-canvas  { z-index: 3; pointer-events: none; }

    video { display: none; }

    /* Mode badge — shown inside canvas top-left */
    #mode-indicator {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      display: flex;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .badge.pen   { background: rgba(191,128,255,0.2); color: #bf80ff; }
    .badge.eraser{ background: rgba(255, 96, 96,0.2); color: #ff8080; }

    #hud {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(10,10,20,0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 12px 24px;
      z-index: 10;
    }

    #gesture {
      font-size: 20px;
      font-weight: 500;
      transition: opacity 0.2s;
      min-width: 140px;
      text-align: center;
    }

    .divider { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }

    .meta { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.05em; }
    .meta span { color: rgba(255,255,255,0.7); font-weight: 500; }

    #status {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: rgba(255,255,255,0.45);
      letter-spacing: 0.05em; z-index: 20; background: #050508;
    }

    .dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #60efff; margin-right: 10px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.15} }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="title">Hand Tracking — MediaPipe</div>
    <button class="ctrl-btn" id="toggle-draw">🎨 วาดรูป: เปิด</button>
    <button class="ctrl-btn" id="clear-draw">🗑 ล้างภาพ</button>
  </div>

  <div id="canvas-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="draw-canvas"></canvas>
    <canvas id="cam-canvas"></canvas>

    <div id="mode-indicator">
      <div class="badge pen">✏️ มือขวา = ปากกา</div>
      <div class="badge eraser">⬜ มือซ้าย = ยางลบ</div>
    </div>
  </div>

  <div id="hud">
    <div id="gesture">ยกมือขึ้น</div>
    <div class="divider"></div>
    <div class="meta"><span id="hand-count">0 มือ</span></div>
    <div class="divider"></div>
    <div class="meta"><span id="fps">— FPS</span></div>
  </div>

  <div id="status"><span class="dot"></span>กำลังโหลด...</div>
</body>
</html>
