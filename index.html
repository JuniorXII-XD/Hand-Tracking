<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking</title>
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/vision_bundle.mjs";

    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17]
    ];
    const FINGER_TIPS  = [4, 8, 12, 16, 20];
    const FINGER_BASES = [2, 6, 10, 14, 18];

    const video     = document.getElementById("video");
    const camCanvas = document.getElementById("cam-canvas");
    const drawCanvas= document.getElementById("draw-canvas");
    const camCtx    = camCanvas.getContext("2d");
    const drawCtx   = drawCanvas.getContext("2d");
    const gestureEl = document.getElementById("gesture");
    const handCountEl = document.getElementById("hand-count");
    const fpsEl     = document.getElementById("fps");
    const statusEl  = document.getElementById("status");
    const toggleBtn = document.getElementById("toggle-draw");
    const clearBtn  = document.getElementById("clear-draw");
    const modeEl    = document.getElementById("mode-indicator");
    const wrap      = document.getElementById("canvas-wrap");

    let landmarker  = null;
    let frameCount  = 0, fps = 0, fpsTimer = 0;
    let drawEnabled = true;

    // Smoothed pinch midpoint per hand (canvas px)
    const smoothed   = { Left: null, Right: null };
    // Last drawn point per hand (for line continuity)
    const lastDrawPt = { Left: null, Right: null };
    // Was pinching last frame
    const wasPinch   = { Left: false, Right: false };

    const ALPHA        = 0.45;   // smoothing (lower = smoother, more lag)
    const PINCH_PX_THR = 0.075;  // normalised dist threshold for pinch
    const ERASER_R     = 40;     // px in canvas space
    const PEN_W        = 5;

    // ---- helpers ----
    function lerpPt(prev, next, a) {
      if (!prev) return { ...next };
      return { x: prev.x + (next.x - prev.x) * a, y: prev.y + (next.y - prev.y) * a };
    }

    function ndist(a, b) { // normalised coords distance
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // ---- init ----
    async function init() {
      statusEl.textContent = "กำลังโหลดโมเดล...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm"
      );
      landmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      statusEl.textContent = "กำลังเปิดกล้อง...";
      try {
        // Simple constraints — works on both desktop & mobile
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          const W = video.videoWidth;
          const H = video.videoHeight;
          // Set canvas resolution to actual video size (no forced aspect ratio)
          camCanvas.width = drawCanvas.width = W;
          camCanvas.height = drawCanvas.height = H;
          // Fix wrap aspect ratio to match real video
          wrap.style.aspectRatio = `${W} / ${H}`;
          // Mirror both canvases
          camCanvas.style.transform = drawCanvas.style.transform = "scaleX(-1)";
          statusEl.style.display = "none";
          requestAnimationFrame(detect);
        };
      } catch (e) {
        statusEl.textContent = "❌ ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้งานกล้อง";
        console.error(e);
      }
    }

    // ---- gesture label ----
    function gestureLabel(lm) {
      const tips  = FINGER_TIPS.map(i => lm[i]);
      const bases = FINGER_BASES.map(i => lm[i]);
      const thumbOpen = lm[4].x < lm[3].x;
      const ext = [1,2,3,4].map(i => tips[i].y < bases[i].y);
      const n = ext.filter(Boolean).length + (thumbOpen ? 1 : 0);
      if (!thumbOpen && ext.every(e=>!e)) return "✊ Fist";
      if (thumbOpen && ext.every(e=>e))   return "🖐 Open Hand";
      if (!thumbOpen && ext[0] && !ext[1] && !ext[2] && !ext[3]) return "☝️ Point";
      if (!thumbOpen && ext[0] &&  ext[1] && !ext[2] && !ext[3]) return "✌️ Peace";
      if (thumbOpen && !ext[0] && !ext[1] && !ext[2] && !ext[3]) return "👍 Thumbs Up";
      if (thumbOpen && !ext[0] && !ext[1] && !ext[2] &&  ext[3]) return "🤙 Call Me";
      return `🖐 ${n} Finger${n!==1?'s':''}`;
    }

    // ---- draw skeleton ----
    function drawSkeleton(lm, hand) {
      const W = camCanvas.width, H = camCanvas.height;
      const isL = hand === "Left";
      const col1 = isL ? "#60efff" : "#bf80ff";
      const col2 = isL ? "#0057ff" : "#7b00ff";
      const tipC = isL ? "#ffffff" : "#ffccff";

      camCtx.lineCap = "round";
      CONNECTIONS.forEach(([a,b]) => {
        const ax=lm[a].x*W, ay=lm[a].y*H, bx=lm[b].x*W, by=lm[b].y*H;
        const g = camCtx.createLinearGradient(ax,ay,bx,by);
        g.addColorStop(0, col1+"cc"); g.addColorStop(1, col2+"cc");
        camCtx.beginPath();
        camCtx.strokeStyle = g;
        camCtx.lineWidth = 3;
        camCtx.shadowColor = col1; camCtx.shadowBlur = 10;
        camCtx.moveTo(ax,ay); camCtx.lineTo(bx,by);
        camCtx.stroke();
      });
      camCtx.shadowBlur = 0;

      lm.forEach((pt,i) => {
        const x=pt.x*W, y=pt.y*H;
        const isTip = FINGER_TIPS.includes(i);
        camCtx.beginPath();
        camCtx.arc(x, y, isTip?8:5, 0, Math.PI*2);
        camCtx.fillStyle = isTip ? tipC : col1;
        camCtx.shadowColor = col1; camCtx.shadowBlur = isTip?20:12;
        camCtx.fill(); camCtx.shadowBlur = 0;
        if (isTip) {
          camCtx.beginPath(); camCtx.arc(x,y,12,0,Math.PI*2);
          camCtx.strokeStyle = col1+"55"; camCtx.lineWidth=2; camCtx.stroke();
        }
      });
    }

    // ---- draw cursor overlay ----
    function drawCursor(x, y, isEraser, active) {
      camCtx.save();
      if (isEraser) {
        camCtx.beginPath(); camCtx.arc(x,y,ERASER_R,0,Math.PI*2);
        camCtx.strokeStyle = active ? "#ff6060" : "rgba(255,100,100,0.45)";
        camCtx.lineWidth = active ? 3 : 1.5;
        camCtx.setLineDash([6,4]); camCtx.stroke(); camCtx.setLineDash([]);
      } else {
        const r = active ? PEN_W : 6;
        camCtx.beginPath(); camCtx.arc(x,y,r,0,Math.PI*2);
        camCtx.fillStyle = active ? "#ffffff" : "rgba(255,255,255,0.35)";
        camCtx.shadowColor = "#bf80ff"; camCtx.shadowBlur = active?22:8;
        camCtx.fill(); camCtx.shadowBlur = 0;
        if (!active) {
          camCtx.strokeStyle = "rgba(255,255,255,0.25)";
          camCtx.lineWidth = 1;
          camCtx.beginPath(); camCtx.moveTo(x-14,y); camCtx.lineTo(x+14,y); camCtx.stroke();
          camCtx.beginPath(); camCtx.moveTo(x,y-14); camCtx.lineTo(x,y+14); camCtx.stroke();
        }
      }
      camCtx.restore();
    }

    // ---- main loop ----
    function detect(ts) {
      if (!landmarker || video.readyState < 2) { requestAnimationFrame(detect); return; }

      frameCount++;
      if (ts - fpsTimer > 1000) {
        fps = frameCount; frameCount = 0; fpsTimer = ts;
        fpsEl.textContent = `${fps} FPS`;
      }

      const res = landmarker.detectForVideo(video, ts);
      const W = camCanvas.width, H = camCanvas.height;

      camCtx.clearRect(0,0,W,H);
      camCtx.drawImage(video,0,0,W,H);
      camCtx.fillStyle = "rgba(0,0,0,0.2)";
      camCtx.fillRect(0,0,W,H);

      const hands = res.landmarks || [];
      handCountEl.textContent = `${hands.length} มือ`;

      const present = new Set();
      const labels  = [];

      hands.forEach((lm, i) => {
        const hand = res.handedness?.[i]?.[0]?.categoryName || "Right";
        present.add(hand);
        drawSkeleton(lm, hand);
        labels.push(gestureLabel(lm));

        if (!drawEnabled) return;

        const thumb = lm[4];  // thumb tip  (landmark 4)
        const index = lm[8];  // index tip  (landmark 8)

        // Pinch = distance between thumb tip & index tip in normalised coords
        const pinching = ndist(thumb, index) < PINCH_PX_THR;

        // Midpoint in canvas px
        const raw = {
          x: (thumb.x + index.x) / 2 * W,
          y: (thumb.y + index.y) / 2 * H
        };

        // Smooth
        smoothed[hand] = lerpPt(smoothed[hand], raw, ALPHA);
        const sx = smoothed[hand].x, sy = smoothed[hand].y;

        drawCursor(sx, sy, hand === "Left", pinching);

        if (pinching) {
          if (hand === "Left") {
            // Eraser
            drawCtx.save();
            drawCtx.globalCompositeOperation = "destination-out";
            drawCtx.beginPath(); drawCtx.arc(sx, sy, ERASER_R, 0, Math.PI*2);
            drawCtx.fill();
            drawCtx.restore();
          } else {
            // Pen — draw line from last point to current
            if (wasPinch[hand] && lastDrawPt[hand]) {
              drawCtx.beginPath();
              drawCtx.moveTo(lastDrawPt[hand].x, lastDrawPt[hand].y);
              drawCtx.lineTo(sx, sy);
              drawCtx.strokeStyle = "#ffffff";
              drawCtx.lineWidth = PEN_W;
              drawCtx.lineCap = "round";
              drawCtx.lineJoin = "round";
              drawCtx.shadowColor = "#bf80ff";
              drawCtx.shadowBlur = 14;
              drawCtx.stroke();
              drawCtx.shadowBlur = 0;
            }
            lastDrawPt[hand] = { x: sx, y: sy };
          }
          wasPinch[hand] = true;
        } else {
          wasPinch[hand] = false;
          lastDrawPt[hand] = null; // lift pen on release
        }
      });

      // Reset state for absent hands
      ["Left","Right"].forEach(h => {
        if (!present.has(h)) {
          smoothed[h] = null;
          wasPinch[h] = false;
          lastDrawPt[h] = null;
        }
      });

      gestureEl.textContent = labels.length ? labels.join("  ") : "ยกมือขึ้น";
      gestureEl.style.opacity = labels.length ? "1" : "0.3";

      requestAnimationFrame(detect);
    }

    // ---- controls ----
    toggleBtn.addEventListener("click", () => {
      drawEnabled = !drawEnabled;
      toggleBtn.textContent = drawEnabled ? "🎨 วาดรูป: เปิด" : "🎨 วาดรูป: ปิด";
      toggleBtn.classList.toggle("off", !drawEnabled);
      modeEl.style.display = drawEnabled ? "flex" : "none";
    });

    clearBtn.addEventListener("click", () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });

    init();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050508;
      color: #fff;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
    }

    #top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }

    #title {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      white-space: nowrap;
    }

    .ctrl-btn {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .ctrl-btn.off   { border-color: rgba(255,80,80,0.35); color: rgba(255,100,100,0.6); }

    #canvas-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(96,239,255,0.05), 0 0 0 1px rgba(255,255,255,0.06);
      /* width fills available space; aspect-ratio set dynamically from video */
      width: min(1280px, 98vw);
      max-height: 82svh;
      /* fallback aspect ratio until video loads */
      aspect-ratio: 4 / 3;
    }

    #canvas-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #draw-canvas { z-index: 2; pointer-events: none; }
    #cam-canvas  { z-index: 3; pointer-events: none; }

    video { display: none; }

    #mode-indicator {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .badge.pen    { background: rgba(191,128,255,0.18); color: #cf9fff; }
    .badge.eraser { background: rgba(255, 96, 96,0.18); color: #ff9090; }

    #hud {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(10,10,20,0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 11px 22px;
      flex-shrink: 0;
    }

    #gesture {
      font-size: 19px;
      font-weight: 500;
      transition: opacity 0.2s;
      min-width: 130px;
      text-align: center;
    }

    .divider { width: 1px; height: 16px; background: rgba(255,255,255,0.1); }

    .meta { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; }
    .meta span { color: rgba(255,255,255,0.65); font-weight: 500; }

    #status {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: rgba(255,255,255,0.4);
      letter-spacing: 0.05em;
      z-index: 20; background: #050508;
    }

    .dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #60efff; margin-right: 10px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.15} }
  </style>
</head>
<body>
  <div id="top-bar">
    <div id="title">Hand Tracking — MediaPipe</div>
    <button class="ctrl-btn" id="toggle-draw">🎨 วาดรูป: เปิด</button>
    <button class="ctrl-btn" id="clear-draw">🗑 ล้างภาพ</button>
  </div>

  <div id="canvas-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="draw-canvas"></canvas>
    <canvas id="cam-canvas"></canvas>
    <div id="mode-indicator">
      <div class="badge pen">✏️ มือขวา = ปากกา</div>
      <div class="badge eraser">⬜ มือซ้าย = ยางลบ</div>
    </div>
  </div>

  <div id="hud">
    <div id="gesture">ยกมือขึ้น</div>
    <div class="divider"></div>
    <div class="meta"><span id="hand-count">0 มือ</span></div>
    <div class="divider"></div>
    <div class="meta"><span id="fps">— FPS</span></div>
  </div>

  <div id="status"><span class="dot"></span>กำลังโหลด...</div>
</body>
</html>
